<!DOCTYPE html>
<html lang="zh-CN" data-theme="acid" data-scheme="ink">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 简沛言 JIANPEIYAN</title>
<meta name="description" content="作品集演示登录。">
<meta name="robots" content="noindex">
<script>(function(){try{var s=localStorage.getItem('jpy-scheme');if(s==='light'||s==='ink')document.documentElement.setAttribute('data-scheme',s)}catch(e){}})();</script>
<link rel="stylesheet" href="blog/blog.css">
<style>
/* 登录页局部样式：复用 blog.css 令牌，只补表单与状态 */
.li-main{min-height:calc(100vh - var(--nav-h));display:grid;place-items:center;padding:32px 16px}
.li-card{width:min(420px,100%);padding:32px 28px;border-radius:var(--r-ctl);background:var(--color-surface);box-shadow:var(--shadow-pop)}
.li-kicker{font-family:var(--font-mono);font-size:12px;color:var(--color-text-3);margin-bottom:8px}
.li-title{font-family:var(--font-zh-title);font-weight:400;font-size:clamp(1.75rem,4vw,2.5rem);line-height:1;margin-bottom:8px}
.li-sub{font-size:14px;color:var(--color-text-2);margin-bottom:24px}
.li-field{margin-bottom:16px}
.li-field label{display:block;font-size:14px;color:var(--color-text-2);margin-bottom:6px}
.li-box{position:relative}
.li-box input{width:100%;min-height:44px;padding:0 88px 0 14px;border:0;border-radius:var(--r-ctl);background:var(--color-surface-2);color:var(--color-text);font:inherit;font-size:16px;box-shadow:var(--ring-soft)}
.li-box input:focus{outline:2px solid var(--color-focus);outline-offset:1px}
.li-field.bad input{box-shadow:inset 0 0 0 1.5px var(--li-err)}
.li-err{display:none;min-height:20px;margin-top:6px;font-size:13px;color:var(--li-err)}
.li-field.bad+.li-err,.li-err.show{display:block}
.li-err[hidden]{display:none}
[data-scheme="light"]{--li-err:#b3261e}
[data-scheme="ink"]{--li-err:#ff9e96}
.li-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:32px;padding:0 10px;border:0;border-radius:var(--r-ctl);background:none;color:var(--color-text-3);font-family:var(--font-mono);font-size:12px;cursor:pointer}
.li-eye:hover{color:var(--color-text)}
.li-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 20px}
.li-row label{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;color:var(--color-text-2);cursor:pointer}
.li-row input{width:18px;height:18px;accent-color:var(--color-text)}
.li-forgot{font-size:13px;color:var(--color-text-3);text-decoration:underline;text-underline-offset:4px;min-height:44px;display:inline-flex;align-items:center}
.li-forgot:hover{color:var(--color-text)}
.li-btn{width:100%;min-height:48px;border:0;border-radius:var(--r-ctl);background:var(--color-action-bg);color:var(--color-action-fg);font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:filter var(--t-fast) var(--ease),transform var(--t-fast) var(--ease-back)}
.li-btn:hover{filter:brightness(var(--hover-bright));transform:translateY(var(--lift-1))}
.li-btn:active{transform:scale(.985)}
.li-btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.li-demo{margin-top:20px;padding-top:16px;box-shadow:inset 0 1px 0 var(--color-divider);font-family:var(--font-mono);font-size:12px;line-height:1.8;color:var(--color-text-3)}
.li-demo b{color:var(--color-text-2);font-weight:600}
.li-ok{text-align:left}
.li-ok .avatar{width:64px;height:64px;margin-bottom:16px}
.li-ok h2{font-family:var(--font-zh-title);font-weight:400;font-size:1.75rem;line-height:1;margin:4px 0 8px}
.li-ok p{font-size:14px;color:var(--color-text-2)}
.li-ok .meta{font-family:var(--font-mono);font-size:12px;color:var(--color-text-3)}
.li-ok .btn{margin-top:20px}
.li-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.li-shake{animation:li-shake .38s var(--ease)}
@keyframes li-shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.li-shake{animation:none}}
.li-note{margin-top:16px;font-size:12px;line-height:1.7;color:var(--color-text-3);max-width:62ch}
</style>
</head>
<body>
<header class="nav"><div class="nav-in">
  <a class="brand" href="index.html" aria-label="简沛言 · 作品集主页"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M 36.82 9.16 L 51.00 9.16 L 51.00 67.83 A 1.35 1.35 0 0 1 49.65 69.18 L 45.26 69.18 A 8.44 8.44 0 0 1 36.82 60.74 Z" fill="currentColor"/><path d="M 80.40 32.98 L 80.40 55.69 A 34.42 34.42 0 0 1 45.98 90.11 A 34.42 34.42 0 0 1 11.59 57.17" fill="none" stroke="currentColor" stroke-width="15.69"/><path d="M 58.64 16.18 L 88.38 16.18" fill="none" stroke="currentColor" stroke-width="14.04"/></svg><span class="px">JPY</span></a>
  <div class="tools"><a class="back" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>返回作品集</span></a>
  <button class="ibtn" id="schemeBtn" type="button" aria-label="切换明暗"></button></div>
</div></header>

<main class="li-main">
  <div class="li-card">
    <form id="form" novalidate>
      <p class="li-kicker">PAPER NOTES · LOGIN</p>
      <h1 class="li-title">登录</h1>
      <p class="li-sub">登录后可以收藏文章与同步阅读进度。</p>
      <div class="li-field" id="fUser">
        <label for="user">账号</label>
        <div class="li-box"><input id="user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      </div>
      <div class="li-field" id="fPass">
        <label for="pass">密码</label>
        <div class="li-box">
          <input id="pass" name="pass" type="password" autocomplete="current-password" required>
          <button class="li-eye" id="eye" type="button" aria-label="显示密码">显示</button>
        </div>
        <p class="li-err" id="passErr" role="alert" hidden></p>
      </div>
      <div class="li-row">
        <label><input type="checkbox" id="remember" checked> 记住我 30 天</label>
        <a class="li-forgot" href="mailto:18382308038@163.com?subject=找回密码">忘了密码</a>
      </div>
      <button class="li-btn" id="go" type="submit">登录</button>
      <p class="li-demo">演示账号：<b>demo</b>　密码：<b>paper2026</b><br>校验在前端完成，仅作流程演示，不是真实鉴权。</p>
    </form>
    <div class="li-ok" id="okView" hidden>
      <p class="li-kicker">SESSION</p>
      <svg class="avatar" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1" width="8" height="4" fill="currentColor"/><rect x="3" y="5" width="6" height="4" fill="currentColor" opacity=".55"/><rect x="2" y="9" width="8" height="2" fill="currentColor" opacity=".35"/></svg>
      <h2 id="okName">demo</h2>
      <p>已登录。收藏与阅读进度会在本机保留。</p>
      <p class="meta" id="okMeta"></p>
      <div class="li-actions">
        <a class="btn-text" href="index.html">去论文精读</a>
        <button class="btn-text" id="out" type="button">退出登录</button>
      </div>
    </div>
    <p class="li-note">说明：GitHub Pages 是纯静态托管，没有服务端；这里的身份校验跑在浏览器里（SHA-256 加盐比对演示凭据），用于展示登录流程与状态处理。真实鉴权按既定方案迁移到腾讯云 CloudBase 后接入。</p>
  </div>
</main>

<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},root=document.documentElement;
var HASH='9fd2fc0ab4d4ace3d64a497f7f3b75a32c3570c3ec0ccd50dd51a018c1d949ad',SALT='jpy-demo-v1';
function sha(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+'|'+t)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
function read(){try{return JSON.parse(localStorage.getItem('jpy-session')||sessionStorage.getItem('jpy-session')||'null')}catch(e){return null}}
function show(ok){
  $('form').hidden=ok;$('okView').hidden=!ok;if(!ok)return;
  var s=read();$('okName').textContent=s?s.user:'';
  $('okMeta').textContent=s?('登录时间 '+(s.ts?new Date(s.ts).toLocaleString('zh-CN'):'')+(s.remember?' · 记住 30 天':' · 本次会话')):'';
}
show(!!read());
$('eye').addEventListener('click',function(){var p=$('pass'),on=p.type==='password';p.type=on?'text':'password';this.textContent=on?'隐藏':'显示';p.focus()});
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var u=$('user').value.trim(),p=$('pass').value;
  $('fUser').classList.remove('bad');$('fPass').classList.remove('bad');$('passErr').hidden=true;
  if(!u||!p){(u?$('fPass'):$('fUser')).classList.add('bad');if(!u){$('passErr').textContent='请输入账号。';$('passErr').hidden=false}else{$('passErr').textContent='请输入密码。';$('passErr').hidden=false}return}
  var btn=$('go');btn.disabled=true;btn.textContent='验证中…';
  sha(p).then(function(h){
    setTimeout(function(){
      if(u==='demo'&&h===HASH){
        var s={user:u,ts:Date.now(),remember:$('remember').checked};
        try{(s.remember?localStorage:sessionStorage).setItem('jpy-session',JSON.stringify(s))}catch(err){}
        show(true);
      }else{
        btn.disabled=false;btn.textContent='登录';
        $('fPass').classList.add('bad');$('passErr').textContent='账号或密码不对。演示账号 demo，密码 paper2026。';$('passErr').hidden=false;
        var c=document.querySelector('.li-card');c.classList.remove('li-shake');void c.offsetWidth;c.classList.add('li-shake');
      }
    },350);   /* 人为延迟：演示提交中状态 */
  });
});
$('out').addEventListener('click',function(){
  try{localStorage.removeItem('jpy-session');sessionStorage.removeItem('jpy-session')}catch(e){}
  show(false);$('go').disabled=false;$('go').textContent='登录';$('pass').value='';
});
})();
</script>
</body>
</html>
